packages:
  - apps/*
  - packages/*

# Flat node_modules so electron-builder and native rebuilds see a conventional tree.
nodeLinker: hoisted

# pnpm does not run dependency build scripts unless allowlisted. Without these the
# Electron binary and better-sqlite3's prebuilt .node never download.
allowBuilds:
  electron: true
  better-sqlite3: true
  esbuild: true
  '@swc/core': true
  electron-winstaller: true
